<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sample Rachel Business</title>
    <meta
      name="description"
      content="A sample business website for a Udacity project"
    />
    <meta name="author" content="Rachel Joyce" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/contact.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="../index.html" class="brand">RJ</a>

        <input
          type="checkbox"
          id="nav-toggle"
          class="nav-toggle"
          aria-hidden="true"
        />
        <label for="nav-toggle" class="nav-toggle-label">
          <span class="sr-only">Toggle navigation</span>
          ☰
        </label>

        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="contact">
      <h1>Contact Rachel's Business</h1>
      <div id="contact-container">
        <section id="contact-image-container">
          <figure>
            <img
              class="contact-image"
              role="img"
              alt="a placeholder image for Rachel's business employees"
            />
            <figcaption>
              Fig.1 - The team, responding to contact forms
            </figcaption>
          </figure>
        </section>
        <section id="contact-form-container">
          <form id="contact-form">
            <label for="contact-name">
              Name
              <input type="text" name="name" id="contact-name" required />
            </label>

            <!-- Used Google for email regex (even though some validation is built in) -->
            <label for="contact-email">
              Email
              <input
                type="email"
                name="email"
                id="contact-email"
                required
                pattern="^[^\s@]+@[^\s@]+\.[^\s@]{2,}$"
                title="Please enter a valid email address (e.g., name@example.com)"
              />
            </label>

            <label for="contact-message">
              Message
              <textarea
                name="message"
                id="contact-message"
                rows="5"
                required
              ></textarea>
            </label>

            <button type="submit" class="submit-button">Send</button>
          </form>
        </section>
      </div>
    </main>

    <footer>
      <div id="footer-left">&copy; Rachel's Site. All rights reserved.</div>
      <div id="footer-center">Socials taken from icons8.com</div>
      <div id="footer-right">
        <a
          href="https://linkedin.com"
          aria-label="Rachel's business LinkedIn profile"
          target="_blank"
        >
          <img
            src="../img/icons8-linkedin-48.gif"
            alt="Business LinkedIn social link"
          />
        </a>
        <a
          href="https://instagram.com"
          aria-label="Rachel's business Instagram profile"
          target="_blank"
        >
          <img
            src="../img/icons8-instagram-48.gif"
            alt="Business Instagram social link"
          />
        </a>
        <a
          href="https://twitter.com"
          aria-label="Rachel's business Twitter profile"
          target="_blank"
        >
          <img
            src="../img/icons8-twitter-bird.gif"
            alt="Busniess Twtter social link"
          />
        </a>
      </div>
    </footer>
  </body>
</html>
